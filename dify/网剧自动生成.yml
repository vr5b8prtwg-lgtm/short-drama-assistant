    - data:
        code: |
          import re

          CN_NUM = {"一": 1, "二": 2, "两": 2, "三": 3, "四": 4, "五": 5,
                    "六": 6, "七": 7, "八": 8, "九": 9}


          def _cn_to_int(s: str) -> int:
              if s.isdigit():
                  return int(s)
              if s == "十":
                  return 10
              total = 0
              if s.startswith("十"):
                  total = 10 + CN_NUM.get(s[1:], 0)
                  return total
              if "十" in s:
                  left, _, right = s.partition("十")
                  return CN_NUM.get(left, 0) * 10 + CN_NUM.get(right, 0)
              return CN_NUM.get(s, 0)


          def main(query: str, draft_outline: str, confirmed_outline: str) -> dict:
              q = (query or "").strip()
              confirm_kw = ["确认", "可以", "开始", "继续", "没问题", "同意", "通过", "ok", "好的", "行", "就这样"]
              revise_kw = ["修改", "调整", "不要", "不行", "换成", "重来", "重新", "再写", "换一个", "按这个改"]
              if not draft_outline and not confirmed_outline:
                  return {"intent": "outline", "ep_number": 0, "rewrite_instruction": ""}
              if confirmed_outline:
                  m = re.search(r"第\s*([0-9一二三四五六七八九十两]+)\s*集", q)
                  if m and any(k in q for k in ["重写", "修改", "改", "换"]):
                      return {"intent": "rewrite_ep", "ep_number": _cn_to_int(m.group(1)),
                              "rewrite_instruction": q}
                  return {"intent": "help", "ep_number": 0, "rewrite_instruction": ""}
              if any(k in q.lower() for k in confirm_kw):
                  return {"intent": "confirm", "ep_number": 0, "rewrite_instruction": ""}
              if any(k in q for k in revise_kw):
                  return {"intent": "revise", "ep_number": 0, "rewrite_instruction": q}
              return {"intent": "help", "ep_number": 0, "rewrite_instruction": ""}
        code_language: python3
        desc: 根据会话状态与用户消息计算意图
