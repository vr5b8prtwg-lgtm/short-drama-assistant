app:
  description: 用即梦网页版 API（标准会员可用）把剧本包自动生成 AI 漫剧素材清单：定妆图 -> 场景图 -> 图生视频，输出每场景图片/视频 URL，供本地 ffmpeg 合成整集。
  icon: 🎬
  icon_type: emoji
  icon_background: '#E4FBCC'
  mode: workflow
  name: 网剧AI漫剧生成
  use_icon_as_answer_icon: false
kind: app
version: "0.7.0"
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      image:
        enabled: false
      enabled: false
    opening_statement: ""
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: code
      id: start-build_payload
      source: start
      sourceHandle: source
      target: build_payload
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: http-request
      id: build_payload-http_generate
      source: build_payload
      sourceHandle: source
      target: http_generate
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: code
      id: http_generate-parse_manifest
      source: http_generate
      sourceHandle: source
      target: parse_manifest
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: end
      id: parse_manifest-end
      source: parse_manifest
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - label: 剧本包文本
          max_length: 200000
          required: true
          type: paragraph
          variable: script_package
        - label: 即梦 sessionid
          required: true
          type: secret-input
          variable: session_id
        - default: http://127.0.0.1:8000
          label: 桥接服务地址
          max_length: 200
          required: true
          type: text-input
          variable: bridge_url
        - default: 否
          label: 只出图不生成视频
          options:
          - 否
          - 是
          required: false
          type: select
          variable: skip_video
        - default: jimeng-4.5
          label: 图片模型
          max_length: 100
          required: false
          type: text-input
          variable: image_model
        - default: jimeng-video-seedance-2.0
          label: 视频模型
          max_length: 100
          required: false
          type: text-input
          variable: video_model
      height: 320
      id: start
      position:
        x: 30
        y: 200
      positionAbsolute:
        x: 30
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "def main(script_package: str, session_id: str, bridge_url: str, skip_video: str, image_model: str, video_model: str) -> dict:\n    import json\n    payload = {\n        \"session_id\": session_id,\n        \"script_package\": script_package,\n        \"base_url\": bridge_url,\n        \"skip_video\": skip_video == \"是\",\n        \"image_model\": image_model,\n        \"video_model\": video_model,\n    }\n    return {\"payload\": json.dumps(payload, ensure_ascii=False)}\n"
        code_language: python3
        desc: 组装编排服务的请求体（JSON 字符串）
        height: 240
        outputs:
          payload:
            children: null
            type: string
        selected: false
        title: 组装请求
        type: code
        variables:
        - value_selector:
          - start
          - script_package
          value_type: string
          variable: script_package
        - value_selector:
          - start
          - session_id
          value_type: string
          variable: session_id
        - value_selector:
          - start
          - bridge_url
          value_type: string
          variable: bridge_url
        - value_selector:
          - start
          - skip_video
          value_type: string
          variable: skip_video
        - value_selector:
          - start
          - image_model
          value_type: string
          variable: image_model
        - value_selector:
          - start
          - video_model
          value_type: string
          variable: video_model
      id: build_payload
      position:
        x: 334
        y: 200
      positionAbsolute:
        x: 334
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: '{{#build_payload.payload#}}'
          type: raw-text
        desc: 调用本地编排服务，自动生成定妆图/场景图/视频
        headers: 'Content-Type: application/json'
        method: post
        params: ''
        selected: false
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 1800
          max_write_timeout: 30
        title: 调用即梦生成
        type: http-request
        url: '{{#start.bridge_url#}}/generate'
        variables: []
      height: 110
      id: http_generate
      position:
        x: 638
        y: 200
      positionAbsolute:
        x: 638
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 300
    - data:
        code: "def main(manifest: dict) -> dict:\n    import json\n    episodes = (manifest or {}).get(\"episodes\") or []\n    chars = (manifest or {}).get(\"characters\") or {}\n    lines = []\n    lines.append(\"剧名：%s\" % ((manifest or {}).get(\"title\") or \"\"))\n    lines.append(\"定妆图：%d 位角色\" % len(chars))\n    lines.append(\"集数：%d\" % len(episodes))\n    for ep in episodes:\n        scenes = ep.get(\"scenes\") or []\n        lines.append(\"第%d集「%s」：%d 个场景\" % (ep.get(\"number\", 0), ep.get(\"title\", \"\"), len(scenes)))\n        for sc in scenes:\n            img = (sc.get(\"image_url\") or \"\").split(\"/\")[-1]\n            vid = (sc.get(\"video_url\") or \"\").split(\"/\")[-1]\n            lines.append(\"  场景%d：图片 %s\" % (sc.get(\"index\", 0), img or sc.get(\"image_url\")))\n            if vid:\n                lines.append(\"          视频 %s\" % vid)\n    return {\"summary\": \"\\n\".join(lines), \"manifest\": json.dumps(manifest, ensure_ascii=False)}\n"
        code_language: python3
        desc: 解析清单并生成人类可读摘要
        height: 240
        outputs:
          manifest:
            children: null
            type: string
          summary:
            children: null
            type: string
        selected: false
        title: 解析清单
        type: code
        variables:
        - value_selector:
          - http_generate
          - body
          value_type: object
          variable: manifest
      id: parse_manifest
      position:
        x: 998
        y: 200
      positionAbsolute:
        x: 998
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 300
    - data:
        desc: ''
        outputs:
        - value_selector:
          - parse_manifest
          - summary
          variable: summary
        - value_selector:
          - parse_manifest
          - manifest
          variable: manifest
        selected: false
        title: 结束
        type: end
      height: 90
      id: end
      position:
        x: 1358
        y: 200
      positionAbsolute:
        x: 1358
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 50
      y: 200
      zoom: 0.8
